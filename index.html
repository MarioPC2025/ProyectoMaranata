<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Solo título y descripción: los plugins de vite/ agregan el resto del head (íconos,
         URL canónica, Open Graph y tarjetas de Twitter, datos estructurados). -->
    <meta
      name="description"
      content="Explora las 344.799 referencias cruzadas de la Biblia: todos los versículos en una línea con sus enlaces como arcos, y cada capítulo con hilos hasta donde se conectan sus versículos."
    />
    <title>%SITE_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      %SITE_NAME% dibuja las 344.799 referencias cruzadas entre los versículos de la Biblia.
      Necesita JavaScript para funcionar.
    </noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
