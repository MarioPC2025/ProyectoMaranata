name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The sources too large to keep in the repository (see data/raw/README.md) are downloaded by
      # the build: the KJV and RV1909 archives and the tagged Hebrew and Greek, about 110 MB in
      # all. The key is the whole pin file, so any re-pin fetches all of them again — which is the
      # safe way round, since the build refuses a local file that does not match its pin rather
      # than replacing it. Between re-pins nothing is downloaded, so a day when an upstream host
      # is down does not stop a deployment.
      - name: Cache the downloaded sources
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('data/sources.json') }}
      # Types, lint, formatting and the unit tests with their coverage thresholds (98% of
      # statements, lines and functions — see vite.config.ts). Any one of them failing fails
      # the job, and with it the pull request.
      - run: npm run check
      - run: npm run build
      - name: Keep the built site for the end-to-end tests
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1

  # The Python that turns the STEPBible files into the word-by-word data of the reader.
  datos:
    name: Word-by-word data tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts -v

  # The flows a reader actually goes through, in a real browser against the built site: reading a
  # chapter, following a cross-reference, the original-language words, switching translation, the
  # layout at twelve widths, and the offline cache — including that a new release replaces an old
  # one, which is the one failure that could strand an audience on a stale version.
  e2e:
    name: End-to-end tests
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Take the site the check job built
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      # Only Chromium: the suite tests this app's behaviour, not browser differences, and the
      # service worker and WebGL both need a real engine rather than three of them.
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # There is no deploy job: Cloudflare Pages builds this repository itself (build command
  # `npm run build`, output directory `dist`), and serves the proxy of the API versions from
  # functions/ in the same project.
